<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f6f3">
  <meta name="description" content="Suivi personnel des BR : saisie, historique, activité annuelle, comparateur et records. Fonctionne hors connexion.">
  <title>BR</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    /* Thème appliqué avant l'affichage pour éviter un flash. */
    try { var t = localStorage.getItem('br.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#view">Aller au contenu</a>
  <div class="app">
    <nav class="nav" aria-label="Navigation principale">
      <a class="brand" href="#/" aria-label="BR — accueil">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9"/><path d="M8 22v-5M13 22V12M18 22v-8M23 22V9" /></svg>
        <span class="brand-name">BR</span>
      </a>
      <a class="nav-link" data-nav="home" href="#/">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
        <span>Accueil</span>
      </a>
      <a class="nav-link" data-nav="history" href="#/historique">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>
        <span>Historique</span>
      </a>
      <a class="nav-link" data-nav="stats" href="#/stats/activite">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15v2M11 11v6M15 7v10M19 12v5"/></svg>
        <span>Statistiques</span>
      </a>
      <a class="nav-link" data-nav="settings" href="#/reglages">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        <span>Réglages</span>
      </a>
    </nav>

    <main id="view" tabindex="-1"></main>

    <button id="fab" class="fab" type="button" aria-label="Nouvelle saisie">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>

  <!-- Formulaire de saisie -->
  <dialog id="entry-dialog" class="dialog" aria-labelledby="entry-title">
    <form method="dialog" novalidate>
      <div class="dlg-head">
        <h2 class="dlg-title" id="entry-title">Nouvelle saisie</h2>
        <button class="icon-btn" type="button" data-close aria-label="Fermer">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <label class="field">
        <span>Nombre de BR</span>
        <div class="stepper stepper-form">
          <button type="button" class="step-btn" data-step="-1" aria-label="Moins">−</button>
          <input name="count" type="number" inputmode="numeric" min="1" max="9999" step="1" required>
          <button type="button" class="step-btn" data-step="1" aria-label="Plus">+</button>
        </div>
      </label>
      <div class="field-row">
        <label class="field"><span>Date</span><input name="date" type="date" required></label>
        <label class="field"><span>Heure</span><input name="time" type="time" required></label>
      </div>
      <button type="button" class="btn btn-ghost btn-sm now-btn" data-now>Maintenant</button>
      <label class="field"><span>Note <small class="muted">(facultatif)</small></span><textarea name="note" rows="2" maxlength="200" placeholder="Contexte, lieu…"></textarea></label>
      <p class="form-error" role="alert"></p>
      <div class="dlg-actions">
        <button type="button" class="btn btn-danger-ghost" data-delete hidden>Supprimer</button>
        <span class="spacer"></span>
        <button type="button" class="btn btn-ghost" data-close>Annuler</button>
        <button type="submit" class="btn btn-primary">Enregistrer</button>
      </div>
    </form>
  </dialog>

  <!-- Confirmation -->
  <dialog id="confirm-dialog" class="dialog dialog-sm" aria-labelledby="confirm-title">
    <h2 class="dlg-title" id="confirm-title"></h2>
    <p class="dlg-text"></p>
    <div class="dlg-actions">
      <span class="spacer"></span>
      <button type="button" class="btn btn-ghost" data-cancel>Annuler</button>
      <button type="button" class="btn btn-primary" data-ok>Confirmer</button>
    </div>
  </dialog>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="js/util.js"></script>
  <script src="js/store.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/views.js"></script>
  <script src="js/heatmap.js"></script>
  <script src="js/compare.js"></script>
  <script src="js/records.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
